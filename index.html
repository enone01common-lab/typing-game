<html lang="ja">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>いきものタイピング</title>
<meta name="description" content="動物や植物の名前を楽しく学べる無料のタイピングゲーム「いきものタイピング」。全20レベルでタイピングスキルを鍛えよう！">
<meta name="keywords" content="タイピング,タイピングゲーム,いきもの,動物,植物,無料,ブラウザゲーム,タイピング練習">
<meta property="og:title" content="いきものタイピング">
<meta property="og:description" content="動物や植物の名前を楽しく学べる無料のタイピングゲーム「いきものタイピング」。全20レベルでタイピングスキルを鍛えよう！">
<meta property="og:type" content="website">
<style>
  :root {
    --primary: #ff8fa3;
    --primary-hover: #ff748c;
    --secondary: #a0c4ff;
    --bg-color: #fdfbfb;
    --text-main: #4a4a4a;
    --text-light: #9ca3af;
    --correct-color: #ff4757;
  }
  
  * { 
    box-sizing: border-box; 
    font-family: 'Zen Maru Gothic', 'Hiragino Rounded W3 JIS2004', 'Meiryo', sans-serif; 
  }
  
  body {
    font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', 'Meiryo', sans-serif;
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--text-main);
  }
  
  .bg-image {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-size: cover;
    background-position: center;
    z-index: -1;
    opacity: 0.4;
    transition: background-image 0.5s ease-in-out;
    pointer-events: none;
  }
  
  .container {
    background: rgba(255, 255, 255, 0.95);
    width: 90%;
    max-width: 650px;
    border-radius: 30px;
    padding: 40px 30px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  
  h1 { 
    margin-top: 0; 
    color: var(--primary); 
    font-size: 28px; 
  }
  
  .level-selector {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  
  .level-btn {
    background: #f1f2f6;
    border: none;
    padding: 12px 24px;
    border-radius: 20px;
    font-size: 16px;
    cursor: pointer;
    color: var(--text-light);
    font-weight: bold;
    transition: all 0.2s;
  }
  
  .level-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
  }

  .level-btn.active {
    background: var(--primary);
    color: white;
    box-shadow: 0 5px 15px rgba(255, 143, 163, 0.4);
  }
  
  .level-btn.cleared {
    background: #d1d8e0;
    color: white;
  }

  .level-btn.cleared.active {
    background: var(--primary);
  }
  
  .status {
    font-size: 18px;
    font-weight: bold;
    color: var(--text-light);
    margin-bottom: 20px;
  }
  
  .word-display {
    font-size: 48px;
    font-weight: bold;
    margin-bottom: 15px;
    min-height: 70px;
    color: var(--text-main);
    text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
    word-break: break-all;
    line-height: 1.4;
  }
  
  rt {
    color: var(--text-light);
    font-size: 18px;
    font-weight: bold;
  }
  
  .romaji-display {
    font-size: 36px;
    letter-spacing: 4px;
    margin-bottom: 30px;
    color: var(--text-light);
    font-family: 'Courier New', Courier, monospace;
    font-weight: bold;
    word-break: break-all;
    line-height: 1.4;
  }
  
  .romaji-display .typed {
    color: var(--correct-color);
    font-weight: bold;
  }
  
  .input-area {
    margin-bottom: 20px;
  }
  
  input[type="text"] {
    width: 80%;
    font-size: 24px;
    padding: 15px 20px;
    border: 3px solid #e1e8ed;
    border-radius: 15px;
    text-align: center;
    outline: none;
    transition: border-color 0.2s, transform 0.1s;
    font-family: 'Courier New', Courier, monospace;
    color: var(--correct-color);
    font-weight: bold;
    background: #f8f9fa;
  }
  
  input[type="text"]:focus {
    border-color: var(--secondary);
    background: white;
  }
  
  .message-area {
    min-height: 50px;
  }
  
  .btn-next {
    background: var(--secondary);
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 25px;
    cursor: pointer;
    display: none;
    margin: 0 auto;
    transition: transform 0.2s;
    box-shadow: 0 5px 15px rgba(160, 196, 255, 0.4);
  }
  
  .btn-next:hover {
    transform: scale(1.05);
  }
  
  .confetti {
    position: fixed;
    top: -10px;
    width: 15px;
    height: 15px;
    z-index: 9999;
    animation: fall linear forwards;
    border-radius: 4px;
  }
  
  @keyframes fall {
    to { transform: translateY(105vh) rotate(720deg); }
  }
  
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); border-color: #ff6b81; }
    75% { transform: translateX(5px); border-color: #ff6b81; }
  }
  
  .shake { animation: shake 0.2s; }
  
  .btn-reset {
    position: absolute;
    top: 15px;
    left: 15px;
    font-size: 13px;
    padding: 6px 12px;
    background-color: #ffffff;
    color: #888888;
    border: 1px solid #cccccc;
    border-radius: 6px;
    cursor: pointer;
    opacity: 0.9;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    transition: all 0.2s;
  }
  .btn-reset:hover {
    opacity: 1;
    background-color: #ffeeee;
    color: #cc0000;
    border-color: #cc0000;
  }
  
  .timer-display {
    font-size: 24px;
    font-weight: bold;
    color: var(--correct-color);
    margin-top: -10px;
    margin-bottom: 15px;
  }
</style>
</head>
<body>
<div id="bg-image" class="bg-image"></div>
<button id="btn-reset" class="btn-reset">データ初期化</button>

<div class="container">
  <h1>🌱 いきものタイピング 🐾</h1>

    <!-- ボタンはJSで生成 -->
  </div>
  
  <div class="status" id="status">レベル 1 - 問題 1 / 10</div>
  <div class="timer-display" id="timer-display" style="display:none;"></div>
  
  <div class="word-display" id="word-display">開始ボタンを押してね</div>
  <div class="romaji-display" id="romaji-display"></div>
  
  <div class="input-area">
    <input type="text" id="type-input" placeholder="ここに入力..." autocomplete="off" spellcheck="false" disabled>
  </div>
  
  <div class="message-area">
    <button class="btn-next" id="btn-next">次のレベルへ進む</button>
  </div>
</div>

      {"kanji": "<ruby>深海<rt>しんかい</rt></ruby>の<ruby>怪物<rt>かいぶつ</rt></ruby>：リュウグウノツカイ & ダイオウグソクムシ", "romaji": "sinkainokaibutu:ryuuguunotukai & daiougusokumusi", "img": "oarfish,giantisopod"},
      {"kanji": "<ruby>甲虫<rt>こうちゅう</rt></ruby>の<ruby>王様<rt>おうさま</rt></ruby>：ヘラクレスオオカブト & ギラファノコギリクワガタ", "romaji": "koutyuunoousama:herakuresuookabuto & girafanokogirikuwagata", "img": "herculesbeetle,stagbeetle"},
      {"kanji": "<ruby>伝説<rt>でんせつ</rt></ruby>の<ruby>幻獣<rt>げんじゅう</rt></ruby>：ドラゴン & フェニックス", "romaji": "densetunogenzyuu:doragon & fenikkusu", "img": "dragon,phoenix"},
      {"kanji": "<ruby>華麗<rt>かれい</rt></ruby>なる<ruby>名花<rt>めいか</rt></ruby>：ラフレシア & 月下美人", "romaji": "kareinarumeika:rafuresia & gekkabizin", "img": "rafflesia,flower"},
      {"kanji": "<ruby>猛毒<rt>もうどく</rt></ruby>の<ruby>生息者<rt>せいそくしゃ</rt></ruby>：キングコブラ & ハブクラゲ", "romaji": "moudokunoseisokusya:kingukobura & habukurage", "img": "cobra,jellyfish"},
      {"kanji": "<ruby>氷海<rt>ひょうかい</rt></ruby>の<ruby>天使<rt>てんし</rt></ruby>：クリオネ & コウテイペンギン", "romaji": "hyoukainotensi:kurione & kouteipengin", "img": "clione,emperorpenguin"},
      {"kanji": "★<ruby>真<rt>しん</rt></ruby>の<ruby>生物王<rt>せいぶつおう</rt></ruby>：全25レベルクリアおめでとう！", "romaji": "*sinnoseibutuou:zen25reberukuriaomedetou!", "img": "champion,king"}
    ]
  };

  const levels = Object.keys(typingData);
  let currentLevel = "1";
  let currentQuestionIndex = 0;
  let currentCharIndex = 0;
  let isPlaying = false;
  let timerInterval = null;
  let timeLeft = 60;
  
  // LocalStorageからクリアデータを取得
  let clearedLevels = JSON.parse(localStorage.getItem('clearedLevels')) || [];

  const levelSelector = document.getElementById('level-selector');
  const statusEl = document.getElementById('status');
  const timerDisplay = document.getElementById('timer-display');
  const wordDisplay = document.getElementById('word-display');
  const romajiDisplay = document.getElementById('romaji-display');
  const typeInput = document.getElementById('type-input');
  const btnNext = document.getElementById('btn-next');

  function getMaxVisibleLevel() {
    if (clearedLevels.some(l => parseInt(l) >= 20)) return 25;
    if (clearedLevels.some(l => parseInt(l) >= 15)) return 20;
    if (clearedLevels.some(l => parseInt(l) >= 10)) return 15;
    return 10;
  }

  function init() {
    // 最後に遊んだレベルを復元
    const savedLevel = localStorage.getItem('lastPlayedLevel');
    if (savedLevel && levels.includes(savedLevel)) {
      currentLevel = savedLevel;
    }

    // 表示可能なレベルを超えている場合は1に戻す
    const maxVisible = getMaxVisibleLevel();
    if (parseInt(currentLevel) > maxVisible) {
      currentLevel = "1";
      localStorage.setItem('lastPlayedLevel', currentLevel);
    }

    renderLevelButtons();
    updateStatusReady();
    
    // 画面のどこをクリックしても入力欄にフォーカスを当てる（ゲーム中のみ）
    document.body.addEventListener('click', () => {
      if (isPlaying) typeInput.focus();
    });
  }

  function renderLevelButtons() {
    levelSelector.innerHTML = '';
    const maxVisible = getMaxVisibleLevel();

    levels.forEach(level => {
      if (parseInt(level) > maxVisible) return; // まだ解放されていないレベルは非表示

      const btn = document.createElement('button');
      btn.className = 'level-btn';
      if (level === currentLevel) btn.classList.add('active');
      if (clearedLevels.includes(level)) btn.classList.add('cleared');
      btn.textContent = `レベル ${level}`;
      btn.onclick = () => {
        if (isPlaying) return; // プレイ中はレベル変更不可
        currentLevel = level;
        localStorage.setItem('lastPlayedLevel', currentLevel);
        renderLevelButtons();
        updateStatusReady();
        startGame();
      };
      levelSelector.appendChild(btn);
    });
  }

  function updateStatusReady() {
    clearInterval(timerInterval);
    timerDisplay.style.display = 'none';
    statusEl.textContent = `レベル ${currentLevel} を選んでいます`;
    wordDisplay.innerHTML = 'ボタンを押してスタート！';
    romajiDisplay.innerHTML = '&nbsp;';
    typeInput.value = '';
    typeInput.disabled = true;
    btnNext.style.display = 'none';
  }

  function startGame() {
    isPlaying = true;
    currentQuestionIndex = 0;
    currentCharIndex = 0;
    typeInput.disabled = false;
    typeInput.focus();
    btnNext.style.display = 'none';
    showQuestion();
  }

  function showQuestion() {
    clearInterval(timerInterval);
    
    if (parseInt(currentLevel) >= 21) {
      timeLeft = currentLevel === "25" ? 50 : 60;
      timerDisplay.style.display = 'block';
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
          timeUp();
        }
      }, 1000);
    } else {
      timerDisplay.style.display = 'none';
    }

    const wordObj = typingData[currentLevel][currentQuestionIndex];
    statusEl.textContent = `レベル ${currentLevel} - 問題 ${currentQuestionIndex + 1} / ${typingData[currentLevel].length}`;
    wordDisplay.innerHTML = wordObj.kanji;
    
    // 背景画像を設定
    updateBackgroundImage(wordObj.img || 'nature');
    
    currentCharIndex = 0;
    updateRomajiDisplay();
  }

  function updateTimerDisplay() {
    timerDisplay.textContent = `⏳ 残り時間: ${timeLeft}秒`;
    if (timeLeft <= 10) {
      timerDisplay.style.color = '#ff0000';
      if (timeLeft % 2 === 0) {
        timerDisplay.style.transform = 'scale(1.1)';
      } else {
        timerDisplay.style.transform = 'scale(1)';
      }
    } else {
      timerDisplay.style.color = 'var(--correct-color)';
      timerDisplay.style.transform = 'scale(1)';
    }
  }

  function timeUp() {
    clearInterval(timerInterval);
    isPlaying = false;
    typeInput.disabled = true;
    wordDisplay.innerHTML = '⏰ タイムアップ！ ⏰<br><span style="font-size:20px; color:#ff4757;">もう一度レベルの最初からやり直してね</span>';
    romajiDisplay.innerHTML = '&nbsp;';
    
    btnNext.textContent = 'もう一度挑戦する';
    btnNext.style.display = 'inline-block';
    btnNext.onclick = startGame;
  }

  async function updateBackgroundImage(keyword) {
    const bgEl = document.getElementById('bg-image');
    try {
      // 最初のキーワードを取り出す（例: "ayu,fish" -> "ayu"）
      const searchKeyword = keyword.split(',')[0].trim();
      const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${searchKeyword}`);
      if (!res.ok) throw new Error('Not found');
      const data = await res.json();
      if (data.originalimage && data.originalimage.source) {
        bgEl.style.backgroundImage = `url('${data.originalimage.source}')`;
        return;
      }
      if (data.thumbnail && data.thumbnail.source) {
        bgEl.style.backgroundImage = `url('${data.thumbnail.source}')`;
        return;
      }
      throw new Error('No image in Wikipedia');
    } catch (e) {
      // Wikipediaで見つからなかった場合はloremflickrにフォールバック
      bgEl.style.backgroundImage = `url('https://loremflickr.com/1280/720/${keyword}')`;
    }
  }

  function escapeHTML(str) {
    return str.replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;');
  }

  function applyDynamicRomaji(wordObj, currentIndex, inputKey) {
    const romaji = wordObj.romaji;
    const typed = romaji.substring(0, currentIndex).toLowerCase();
    const untyped = romaji.substring(currentIndex).toLowerCase();
    const inKey = inputKey.toLowerCase();
    
    if (inKey === 'n' && typed.endsWith('n') && !typed.endsWith('nn') && untyped.length > 0) {
      const nextChar = untyped[0];
      const vowelsAndY = ['a','i','u','e','o','y','n'];
      if (!vowelsAndY.includes(nextChar)) {
        wordObj.romaji = romaji.substring(0, currentIndex) + 'n' + romaji.substring(currentIndex);
        return;
      }
    }

    const alts = [
      ['si', 'shi'], ['shi', 'si'],
      ['ti', 'chi'], ['chi', 'ti'],
      ['tu', 'tsu'], ['tsu', 'tu'],
      ['hu', 'fu'],  ['fu', 'hu'],
      ['zi', 'ji'],  ['ji', 'zi'],
      ['sya', 'sha'], ['sha', 'sya'],
      ['syu', 'shu'], ['shu', 'syu'],
      ['syo', 'sho'], ['sho', 'syo'],
      ['tya', 'cha'], ['cha', 'tya'],
      ['tyu', 'chu'], ['chu', 'tyu'],
      ['tyo', 'cho'], ['cho', 'tyo'],
      ['zya', 'ja'],  ['ja', 'zya'],
      ['zyu', 'ju'],  ['ju', 'zyu'],
      ['zyo', 'jo'],  ['jo', 'zyo'],
      ['zya', 'jya'], ['jya', 'zya'],
      ['zyu', 'jyu'], ['jyu', 'zyu'],
      ['zyo', 'jyo'], ['jyo', 'zyo'],
      ['ja', 'jya'],  ['jya', 'ja'],
      ['ju', 'jyu'],  ['jyu', 'ju'],
      ['jo', 'jyo'],  ['jyo', 'jo']
    ];

    for (let i = 0; i < alts.length; i++) {
      const orig = alts[i][0];
      const alt = alts[i][1];
      for (let L = 0; L < orig.length; L++) {
        const origPrefix = orig.substring(0, L);
        const origSuffix = orig.substring(L);
        if (typed.endsWith(origPrefix) && untyped.startsWith(origSuffix)) {
          if (alt.startsWith(origPrefix) && alt[L] === inKey) {
            wordObj.romaji = romaji.substring(0, currentIndex - L) + alt + romaji.substring(currentIndex + origSuffix.length);
            return;
          }
        }
      }
    }
  }

  function updateRomajiDisplay() {
    const wordObj = typingData[currentLevel][currentQuestionIndex];
    const romaji = wordObj.romaji;
    
    // 空白（スペース）を記号「␣」に変換して視覚的にわかりやすくする
    const displayRomaji = romaji.replace(/ /g, '␣');
    
    const typed = displayRomaji.substring(0, currentCharIndex);
    const untyped = displayRomaji.substring(currentCharIndex);
    
    const escTyped = escapeHTML(typed);

    if (parseInt(currentLevel) >= 7) {
      // 未入力の文字は「*」にするが、「␣」だけはそのまま表示する
      const hiddenUntyped = untyped.split('').map(c => c === '␣' ? '␣' : '*').join('');
      const escHidden = escapeHTML(hiddenUntyped);
      romajiDisplay.innerHTML = `<span class="typed">${escTyped}</span><span class="untyped" style="opacity: 0.3;">${escHidden}</span>`;
    } else {
      const escUntyped = escapeHTML(untyped);
      romajiDisplay.innerHTML = `<span class="typed">${escTyped}</span><span class="untyped">${escUntyped}</span>`;
    }
    // 実際の入力欄には本来の文字列を入れる
    typeInput.value = romaji.substring(0, currentCharIndex);
  }

  // キー入力を監視
  typeInput.addEventListener('keydown', (e) => {
    if (!isPlaying) return;
    
    // 修飾キーやIMEなどの単一文字以外の入力は無視
    if (e.key.length !== 1 || e.ctrlKey || e.metaKey || e.altKey) return;
    
    e.preventDefault(); // デフォルトの入力を防ぎ、自前で管理する

    let inputKey = e.key;
    // 全角記号や英数字を半角に変換
    inputKey = inputKey.replace(/[！-～]/g, function(s) {
      return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
    });
    // その他のよくある全角記号を個別に半角化
    if (inputKey === '”') inputKey = '"';
    if (inputKey === '’') inputKey = "'";
    if (inputKey === '‘') inputKey = "`";
    if (inputKey === '￥') inputKey = '\\';
    if (inputKey === '　') inputKey = ' ';
    if (inputKey === '〜') inputKey = '~';

    const wordObj = typingData[currentLevel][currentQuestionIndex];
    
    // ダイナミックローマ字変換（si/shi などの揺れを吸収）
    applyDynamicRomaji(wordObj, currentCharIndex, inputKey);

    const targetChar = wordObj.romaji[currentCharIndex];

    // ハイフンと伸ばし棒を同一視する
    let isCorrect = false;
    if (inputKey.toLowerCase() === targetChar.toLowerCase()) {
      isCorrect = true;
    } else if (targetChar === 'ー' && (inputKey === '-' || inputKey === '−' || inputKey === '―' || inputKey === '‐')) {
      isCorrect = true;
    } else if (targetChar === '-' && (inputKey === 'ー' || inputKey === '−' || inputKey === '―' || inputKey === '‐')) {
      isCorrect = true;
    }

    if (isCorrect) {
      // 正解
      currentCharIndex++;
      updateRomajiDisplay();
      
      // 単語クリア判定
      if (currentCharIndex === wordObj.romaji.length) {
        setTimeout(nextQuestion, 150); // 少し待ってから次の問題へ
      }
    } else {
      // 不正解
      typeInput.classList.remove('shake');
      void typeInput.offsetWidth; // アニメーションをリセットするためのハック
      typeInput.classList.add('shake');
    }
  });

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex >= typingData[currentLevel].length) {
      levelClear();
    } else {
      showQuestion();
    }
  }

  function levelClear() {
    clearInterval(timerInterval);
    timerDisplay.style.display = 'none';
    isPlaying = false;
    typeInput.disabled = true;
    
    // クリアデータを保存
    if (!clearedLevels.includes(currentLevel)) {
      clearedLevels.push(currentLevel);
      localStorage.setItem('clearedLevels', JSON.stringify(clearedLevels));
    }
    
    renderLevelButtons();

    statusEl.textContent = `レベル ${currentLevel} クリア！`;
    wordDisplay.innerHTML = '🎉 素晴らしい！ 🎉';
    romajiDisplay.innerHTML = '&nbsp;';
    
    if (clearedLevels.length === levels.length) {
      wordDisplay.innerHTML = '👑 全クリアおめでとう！ 👑<br><span style="font-size:20px; color:#9ca3af;">すべての生き物をマスターしたね！</span>';
      showConfetti();
    } else {
      // 次のレベルへ進むボタンを表示
      const nextLevelIndex = levels.indexOf(currentLevel) + 1;
      if (nextLevelIndex < levels.length) {
        btnNext.textContent = `レベル ${levels[nextLevelIndex]} へ進む`;
        btnNext.style.display = 'inline-block';
        btnNext.onclick = () => {
          currentLevel = levels[nextLevelIndex];
          localStorage.setItem('lastPlayedLevel', currentLevel);
          renderLevelButtons();
          startGame();
        };
      }
    }
  }

  function showConfetti() {
    const colors = ['#ff8fa3', '#a0c4ff', '#ffd166', '#06d6a0', '#118ab2', '#ff9f43'];
    for (let i = 0; i < 150; i++) {
      const confetti = document.createElement('div');
      confetti.classList.add('confetti');
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      
      // ランダムなサイズと回転
      const size = Math.random() * 10 + 5;
      confetti.style.width = size + 'px';
      confetti.style.height = size + 'px';
      
      document.body.appendChild(confetti);
      
      // アニメーション終了後に要素を削除
      setTimeout(() => confetti.remove(), 5000);
    }
  }

  // ESCキーでゲームを中断してレベル選択に戻る
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isPlaying) {
      isPlaying = false;
      updateStatusReady();
      renderLevelButtons();
    }
  });

  // データ初期化ボタン
  document.getElementById('btn-reset').addEventListener('click', () => {
    if (confirm('クリアしたレベルのデータをすべて初期化しますか？\n（この操作は取り消せません）')) {
      localStorage.removeItem('clearedLevels');
      localStorage.removeItem('lastPlayedLevel');
      location.reload();
    }
  });

  // 初期化
  init();
</script>
</body>
</html>
